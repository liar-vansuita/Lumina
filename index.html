<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9db4d8"><meta name="description" content="Lumina — Ilumine seu futuro financeiro.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg">
<title>Lumina — Controle financeiro</title>
<style>
:root{--bg:#a9bddc;--panel:#f5f7fc;--panel2:#e4ebf7;--ink:#172746;--muted:#657795;--accent:#172746;--accentText:#fff;--line:#c8d5e9;--good:#16865b;--bad:#c7473e;--warn:#d59b20;--shadow:0 8px 28px #20385b18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0} .app{max-width:1440px;margin:auto;padding:22px clamp(14px,3vw,38px) 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:30px}.brand h1{font-size:22px;margin:0;letter-spacing:-.6px}.brand p{margin:0;color:var(--muted);font-size:12px}.header-actions{display:flex;gap:8px;align-items:center}
.pill,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 15px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.btn.small{padding:7px 11px;font-size:13px}.btn.danger{color:var(--bad)}
nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 24px}.navbtn{padding:10px 15px;border-radius:999px;background:#ffffff35;border:1px solid #ffffff55;color:var(--ink)}.navbtn.active{background:var(--accent);color:var(--accentText)}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.pagehead h2{font-size:20px;margin:0}.monthpick{display:flex;align-items:center;gap:12px;background:var(--panel);padding:7px 12px;border-radius:30px}.monthpick button{background:none;color:var(--ink);font-size:18px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{background:var(--panel);border:1px solid #ffffff90;border-radius:20px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat{position:relative;overflow:hidden}.stat:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--stripe,var(--accent))}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.value{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:6px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.sectiontitle h3{font-size:16px;margin:0}
input,select,textarea{width:100%;background:#fff;color:#172746;border:1px solid var(--line);border-radius:11px;padding:10px 11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid .wide{grid-column:1/-1}.formrow{display:flex;gap:8px;align-items:end}.formrow>*{flex:1}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item strong{display:block;font-size:14px}.item small{color:var(--muted)}.amount{font-weight:750;white-space:nowrap}.positive{color:var(--good)}.negative{color:var(--bad)}.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
.progress{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--good);border-radius:20px}.barrow{display:grid;grid-template-columns:100px 1fr 90px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}th,td{padding:11px 9px;border:1px solid var(--line);text-align:right}th{background:var(--panel2);font-size:11px;text-transform:uppercase}td:first-child,th:first-child{text-align:left}.tablewrap{overflow:auto;border-radius:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.tag{padding:4px 8px;border-radius:30px;background:var(--panel2);font-size:11px;color:var(--muted)}
.themegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.theme{border:2px solid transparent;border-radius:12px;padding:10px;text-align:left;color:#172746}.theme.selected{border-color:var(--accent)}.theme i{display:block;height:18px;border-radius:6px;margin-bottom:6px}
.notice{background:var(--panel2);padding:12px 14px;border-radius:13px;color:var(--muted);font-size:13px}.hidden{display:none!important}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:var(--panel2);border-radius:9px;min-height:70px;padding:7px;font-size:12px}.day.muted{opacity:.4}.eventdot{display:block;margin-top:5px;padding:3px 5px;border-radius:5px;background:#f6d9a4;color:#694b12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:24px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accentText);padding:11px 18px;border-radius:30px;box-shadow:var(--shadow);z-index:5}
.mobilebar{display:none}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.app{padding-top:14px}.pagehead{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){header{align-items:flex-start}.brand h1{font-size:19px}.header-actions .pill{font-size:12px;padding:8px}.app{padding:12px 12px 85px}nav{display:none}.stats{gap:9px}.card{padding:14px;border-radius:16px}.value{font-size:22px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.mobilebar{display:flex;position:fixed;z-index:4;bottom:0;left:0;right:0;justify-content:space-around;background:var(--panel);padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 25px #17274618}.mobilebar button{background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.mobilebar button b{font-size:19px}.mobilebar button.active{color:var(--accent);font-weight:800}.themegrid{grid-template-columns:repeat(2,1fr)}.calendar .day{min-height:54px;padding:5px}.barrow{grid-template-columns:75px 1fr 72px}}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">💡</div><div><h1>Lumina</h1><p>Ilumine seu futuro financeiro.</p></div></div><div class="header-actions"><span class="pill" id="greeting">Bom dia!</span><button class="pill" id="installBtn">＋ Instalar</button></div></header>
<nav id="nav"></nav><main id="main"></main><footer>Seus dados ficam neste dispositivo. Faça backups regularmente. Educação financeira não é recomendação de investimento.</footer></div>
<div class="mobilebar" id="mobilebar"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10), monthKey=d=>d.slice(0,7), monthName=k=>new Date(k+'-02').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}), uid=()=>Math.random().toString(36).slice(2,10);
const names=['Painel','Visão anual','Meses','Calendário','Objetivos','Relatórios','Aprender','Vila Próspera','Conquistas','Configurações'];const icons=['🏠','📊','📁','🗓️','🎯','📈','🎓','🏙️','🏆','⚙️'];
let data=JSON.parse(localStorage.getItem('lumina-data')||'null')||{transactions:[],goals:[],limits:{},settings:{theme:'azul'},done:[],calendar:[]};let page='Painel',selected=monthKey(today());
const themes={azul:['#a9bddc','#f5f7fc','#172746'],amarelo:['#f3e7b2','#fffaf0','#8a5a08'],roxo:['#d9c9ec','#fbf8ff','#58327e'],rosa:['#f1cddd','#fff8fb','#922e63'],verde:['#c9e2d1','#f7fcf8','#245b3a'],vermelho:['#edc8c7','#fff8f7','#762d35'],claro:['#edf1f7','#fff','#24334e'],escuro:['#202a3c','#2d394f','#f2f5ff']};
function save(){localStorage.setItem('lumina-data',JSON.stringify(data));}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2200)}
function tx(month=selected){return data.transactions.filter(x=>monthKey(x.date)===month)}
function sums(month=selected){let a=tx(month),income=a.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),expense=a.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),saving=a.filter(x=>x.type==='saving').reduce((s,x)=>s+x.amount,0);return{income,expense,saving,balance:income-expense-saving}}
function applyTheme(){let t=themes[data.settings.theme]||themes.azul;document.documentElement.style.setProperty('--bg',t[0]);document.documentElement.style.setProperty('--panel',t[1]);document.documentElement.style.setProperty('--accent',t[2]);document.documentElement.style.setProperty('--accentText',data.settings.theme==='escuro'?'#fff':'#fff');document.querySelector('meta[name=theme-color]').content=t[0]}
function nav(){let html=names.map((n,i)=>`<button class="navbtn ${page===n?'active':''}" data-page="${n}">${icons[i]} ${n}</button>`).join('');$('#nav').innerHTML=html;$('#mobilebar').innerHTML=names.slice(0,5).map((n,i)=>`<button class="${page===n?'active':''}" data-page="${n}"><b>${icons[i]}</b>${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function monthControl(){return `<div class="monthpick"><button id="prev">‹</button><strong>${monthName(selected)}</strong><button id="next">›</button></div>`}
function stat(title,val,sub,color){return `<div class="card stat" style="--stripe:${color}"><div class="eyebrow">${title}</div><div class="value">${money(val)}</div><div class="sub">${sub}</div></div>`}
function panel(){let s=sums(),list=tx().slice().sort((a,b)=>b.date.localeCompare(a.date));let lim=Number(data.limits[selected]||0),pct=lim?Math.min(100,s.expense/lim*100):0;
return `<div class="pagehead"><h2>Seu painel financeiro</h2>${monthControl()}</div><div class="grid stats">${stat('Recebido no mês',s.income,'Salário + rendas extras','#172746')}${stat('Total gasto',s.expense,'Despesas fixas e variáveis','#c7473e')}${stat('Sobrou',s.balance,'Depois dos gastos e poupanças','#16865b')}${stat('Guardado',s.saving,'Dinheiro separado para objetivos','#d59b20')}</div>
<div class="grid two"><section class="card"><div class="sectiontitle"><h3>Adicionar movimentação</h3><span class="tag">rápido</span></div><form id="txform" class="formgrid"><div><label>Tipo</label><select name="type"><option value="income">Recebimento</option><option value="expense">Despesa</option><option value="saving">Poupança</option></select></div><div><label>Data</label><input name="date" type="date" value="${today()}" required></div><div><label>Descrição</label><input name="title" placeholder="Ex.: salário, mercado, internet" required></div><div><label>Categoria</label><select name="category"><option>Salário</option><option>Extra</option><option>Moradia</option><option>Alimentação</option><option>Transporte</option><option>Saúde</option><option>Assinaturas</option><option>Lazer</option><option>Educação</option><option>Investimentos</option><option>Outros</option></select></div><div><label>Valor (R$)</label><input name="amount" type="number" min=".01" step=".01" placeholder="0,00" required></div><div><label>Classificação</label><select name="status"><option>Pago</option><option>A pagar</option><option>Não pago</option><option>Prioridade</option></select></div><div class="wide"><button class="btn primary" type="submit">＋ Salvar movimentação</button></div></form></section>
<section class="card"><div class="sectiontitle"><h3>Limite de gastos do mês</h3><span class="tag">${lim?Math.round(pct)+'% usado':'não definido'}</span></div><form id="limitform" class="formrow"><div><label>Meu limite (R$)</label><input name="limit" type="number" min="0" step=".01" value="${lim||''}" placeholder="Ex.: 1500"></div><button class="btn primary">Salvar</button></form><div class="progress"><span style="width:${pct}%;background:${pct>100?'var(--bad)':'var(--good)'}"></span></div><p class="sub">${lim?`${money(Math.max(0,lim-s.expense))} restantes do limite`:'Defina um teto mensal para acompanhar seus gastos.'}</p><div class="notice">Dica: planeje primeiro as contas essenciais, depois defina um valor realista para lazer e compras.</div></section></div>
<section class="card" style="margin-top:14px"><div class="sectiontitle"><h3>Movimentações de ${monthName(selected)}</h3><span class="tag">${list.length} registros</span></div><div class="list">${list.length?list.map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><small>${x.date.split('-').reverse().join('/')} · ${esc(x.category)} · ${esc(x.status)}</small></div><div><span class="amount ${x.type==='income'?'positive':x.type==='expense'?'negative':''}">${x.type==='income'?'+':x.type==='expense'?'-':''}${money(x.amount)}</span> <button class="btn small danger" data-del="${x.id}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma movimentação neste mês. Comece registrando seu primeiro recebimento ou gasto.</div>'}</div></section>`}
function annual(){let year=selected.slice(0,4);return `<div class="pagehead"><h2>Visão anual</h2><div class="monthpick"><button id="prev">‹</button><strong>${year}</strong><button id="next">›</button></div></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Mês</th><th>Recebimentos</th><th>Despesas</th><th>Poupanças</th><th>Saldo final</th></tr></thead><tbody>${Array.from({length:12},(_,i)=>{let k=year+'-'+String(i+1).padStart(2,'0'),s=sums(k);return `<tr><td>${new Date(k+'-02').toLocaleDateString('pt-BR',{month:'long'})}</td><td class="positive">${money(s.income)}</td><td class="negative">${money(s.expense)}</td><td>${money(s.saving)}</td><td>${money(s.balance)}</td></tr>`}).join('')}</tbody></table></div></section>`}
function months(){return `<div class="pagehead"><h2>Pastas por mês</h2><span class="tag">Ano → mês → movimentações</span></div><div class="grid three">${Array.from({length:12},(_,i)=>{let k=selected.slice(0,4)+'-'+String(i+1).padStart(2,'0'),s=sums(k);return `<button class="card" data-month="${k}" style="text-align:left;color:var(--ink)"><strong>${monthName(k)}</strong><div class="sub">Entradas ${money(s.income)}</div><div class="sub">Gastos ${money(s.expense)}</div><div class="sub">Saldo ${money(s.balance)}</div></button>`}).join('')}</div>`}
function calendar(){let [y,m]=selected.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div class="day muted"></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=data.transactions.filter(x=>x.date===date);cells+=`<div class="day"><strong>${d}</strong>${ev.map(x=>`<span class="eventdot">${esc(x.title)} ${money(x.amount)}</span>`).join('')}</div>`}return `<div class="pagehead"><h2>Calendário financeiro</h2>${monthControl()}</div><section class="card"><div class="legend" style="margin-bottom:12px"><span><i class="dot" style="background:#16865b"></i>Pago</span><span><i class="dot" style="background:#d59b20"></i>A pagar</span><span><i class="dot" style="background:#c7473e"></i>Não pago</span><span><i class="dot" style="background:#8061cf"></i>Prioridade</span></div><div class="calendar">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="eyebrow">${x}</div>`).join('')}${cells}</div></section>`}
function goals(){return `<div class="pagehead"><h2>Objetivos e poupanças</h2><span class="tag">Cada passo conta</span></div><div class="grid two"><section class="card"><h3>Criar objetivo</h3><form id="goalform" class="formgrid"><div class="wide"><label>Nome da meta</label><input name="title" placeholder="Ex.: reserva de emergência" required></div><div><label>Valor desejado (R$)</label><input name="target" type="number" min="1" step=".01" required></div><div><label>Já tenho (R$)</label><input name="current" type="number" min="0" step=".01" value="0"></div><div class="wide"><button class="btn primary">＋ Criar meta</button></div></form></section><section class="card"><h3>Minhas metas</h3><div class="list">${data.goals.length?data.goals.map(g=>{let p=Math.min(100,g.current/g.target*100);return `<div class="item" style="display:block"><div class="sectiontitle"><strong>${esc(g.title)}</strong><button class="btn small danger" data-goaldel="${g.id}">Excluir</button></div><div class="sub">${money(g.current)} de ${money(g.target)} · ${Math.round(p)}%</div><div class="progress"><span style="width:${p}%"></span></div><form data-goaladd="${g.id}" class="formrow"><div><input name="add" type="number" min=".01" step=".01" placeholder="Quanto guardar agora?"></div><button class="btn small">Adicionar</button></form></div>`}).join(''):'<div class="empty">Crie sua primeira meta. Sugestão: comece por uma pequena reserva para imprevistos.</div>'}</div></section></div>`}
function reports(){let s=sums(),by={};tx().filter(x=>x.type==='expense').forEach(x=>by[x.category]=(by[x.category]||0)+x.amount);let max=Math.max(1,...Object.values(by));return `<div class="pagehead"><h2>Relatórios</h2>${monthControl()}</div><div class="grid stats">${stat('Entradas',s.income,'No mês','#172746')}${stat('Despesas',s.expense,'No mês','#c7473e')}${stat('Poupado',s.saving,'No mês','#d59b20')}${stat('Saldo',s.balance,'No mês','#16865b')}</div><section class="card"><h3>Gastos por categoria</h3>${Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="progress"><span style="width:${v/max*100}%;background:var(--bad)"></span></div><strong>${money(v)}</strong></div>`).join(''):'<div class="empty">Registre despesas para visualizar seus gráficos.</div>'}</section>`}
function learn(){return `<div class="pagehead"><h2>Aprender</h2><span class="tag">Conhecimento antes do investimento</span></div><div class="grid two"><section class="card"><h3>Trilha: organizar primeiro</h3><ol><li>Mapeie quanto entra e quanto sai.</li><li>Separe despesas essenciais e não essenciais.</li><li>Monte uma reserva para imprevistos.</li><li>Quite dívidas caras antes de assumir riscos.</li><li>Defina objetivos e prazos.</li></ol></section><section class="card"><h3>Investimentos sem mistério</h3><div class="item"><div><strong>Dólar</strong><small>Moeda estrangeira; seu preço varia e há custos de câmbio.</small></div></div><div class="item"><div><strong>Criptoativos</strong><small>Ativos muito voláteis; risco de perda relevante e golpes.</small></div></div><div class="item"><div><strong>Renda fixa</strong><small>Compare prazo, liquidez, risco e proteção antes de investir.</small></div></div><div class="notice">Isto é conteúdo educativo, não indicação de compra. Nunca invista dinheiro de contas essenciais ou da reserva imediata em ativos voláteis.</div></section></div>`}
function city(){let s=sums(),level=s.balance>=1000?5:s.balance>=500?4:s.balance>=200?3:s.balance>=50?2:1;let stages=['Terreno vazio','Barraca','Casinha','Comércio','Prédio','Cidade completa'];return `<div class="pagehead"><h2>Vila Próspera</h2><span class="tag">Jogo de hábitos, não de dinheiro gasto</span></div><section class="card" style="text-align:center"><div style="font-size:64px">🏞️ ${['','🏕️','🏠','🏪','🏢','🏙️'][level]}</div><h2>${stages[level]}</h2><p class="sub">Nível ilustrativo baseado no progresso registrado. A cidade não gera dinheiro real.</p><div class="progress"><span style="width:${level/5*100}%"></span></div><p>Continue registrando, planejando e cumprindo suas metas para desbloquear etapas.</p></section>`}
function trophies(){let count=data.transactions.length,goalCount=data.goals.length;let achievements=[['Primeiro registro',count>=1,'Registre sua primeira movimentação.'],['Organização em andamento',count>=10,'Registre 10 movimentações.'],['Primeira meta',goalCount>=1,'Crie seu primeiro objetivo.'],['Planejador',!!data.limits[selected],'Defina um limite mensal.']];return `<div class="pagehead"><h2>Conquistas</h2><span class="tag">${achievements.filter(x=>x[1]).length}/${achievements.length} desbloqueadas</span></div><div class="grid two">${achievements.map(a=>`<div class="card"><div style="font-size:28px">${a[1]?'🏆':'🔒'}</div><strong>${a[0]}</strong><p class="sub">${a[2]}</p><span class="tag">${a[1]?'Conquistada':'Ainda bloqueada'}</span></div>`).join('')}</div>`}
function settings(){return `<div class="pagehead"><h2>Configurações e backup</h2></div><section class="card"><h3>Escolha seu tema Serenity</h3><div class="themegrid">${Object.entries(themes).map(([k,v])=>`<button class="theme ${data.settings.theme===k?'selected':''}" data-theme="${k}"><i style="background:${v[0]}"></i>${({azul:'Azul serenity',amarelo:'Amarelo serenity',roxo:'Lilás serenity',rosa:'Rosa serenity',verde:'Verde serenity',vermelho:'Vermelho serenity',claro:'Modo claro',escuro:'Modo escuro'})[k]}</button>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Seus dados</h3><p class="sub">Exporte uma cópia para guardar seus registros ou importar em outro dispositivo manualmente.</p><div class="formrow"><button class="btn primary" id="export">Baixar backup JSON</button><label class="btn" style="text-align:center">Importar backup<input id="import" type="file" accept="application/json" hidden></label></div><p class="notice" style="margin-top:14px">A versão atual salva os dados neste navegador. Para sincronizar automaticamente entre celular, tablet e PC, será necessário conectar uma conta e um banco de dados na nuvem (por exemplo, Supabase). O funcionamento offline permanece disponível; alterações feitas sem internet precisam ser sincronizadas quando a conexão voltar.</p></section>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){applyTheme();nav();let views={'Painel':panel,'Visão anual':annual,'Meses':months,'Calendário':calendar,'Objetivos':goals,'Relatórios':reports,'Aprender':learn,'Vila Próspera':city,'Conquistas':trophies,'Configurações':settings};$('#main').innerHTML=views[page]();let d=new Date();$('#greeting').textContent=(d.getHours()<5?'Boa madrugada':d.getHours()<12?'Bom dia':d.getHours()<18?'Boa tarde':'Boa noite')+'!';
$('#prev')?.addEventListener('click',()=>shift(-1));$('#next')?.addEventListener('click',()=>shift(1));
$('#txform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data.transactions.push({id:uid(),type:f.get('type'),date:f.get('date'),title:f.get('title'),category:f.get('category'),amount:Number(f.get('amount')),status:f.get('status')});selected=monthKey(f.get('date'));save();render();toast('Movimentação salva!')});
$('#limitform')?.addEventListener('submit',e=>{e.preventDefault();data.limits[selected]=Number(new FormData(e.target).get('limit'));save();render();toast('Limite atualizado!')});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data.transactions=data.transactions.filter(x=>x.id!==b.dataset.del);save();render();toast('Registro excluído.')});
document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{selected=b.dataset.month;page='Painel';render()});
$('#goalform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data.goals.push({id:uid(),title:f.get('title'),target:Number(f.get('target')),current:Number(f.get('current'))});save();render();toast('Objetivo criado!')});
document.querySelectorAll('[data-goaldel]').forEach(b=>b.onclick=()=>{data.goals=data.goals.filter(g=>g.id!==b.dataset.goaldel);save();render()});
document.querySelectorAll('[data-goaladd]').forEach(f=>f.onsubmit=e=>{e.preventDefault();let g=data.goals.find(x=>x.id===f.dataset.goaladd);g.current+=Number(new FormData(f).get('add'));save();render();toast('Progresso atualizado!')});
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{data.settings.theme=b.dataset.theme;save();render()});
$('#export')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lumina-backup.json';a.click();URL.revokeObjectURL(a.href)});
$('#import')?.addEventListener('change',async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.transactions||!d.goals)throw 0;data=d;save();render();toast('Backup importado!')}catch{toast('Arquivo de backup inválido.')}});
}
function shift(n){let d=new Date(selected+'-02');d.setMonth(d.getMonth()+n);selected=monthKey(d.toISOString().slice(0,10));render()}
render();
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}else toast('No Chrome: menu ⋮ → Instalar aplicativo.')}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
